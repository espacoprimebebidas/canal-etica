<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F7F5F0;
  --surface:#FFFFFF;
  --surface-2:#FBFAF7;
  --ink:#17223B;
  --ink-2:#4B5468;
  --ink-3:#8B93A3;
  --border:rgba(23,34,59,0.12);
  --border-strong:rgba(23,34,59,0.24);
  --accent:#0F6B5C;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4F1EE;
  --good:#0ca30c;
  --warning:#c98500;
  --serious:#c85a37;
  --critical:#c23636;
  --cat-1:#2a78d6; --cat-2:#c85a2a; --cat-3:#1a9c6c; --cat-4:#b8790a; --cat-5:#c15f8a;
  --shadow: 0 1px 2px rgba(23,34,59,.06), 0 10px 28px -14px rgba(23,34,59,.22);
  --focus-ring: 0 0 0 3px rgba(15,107,92,.35);
  --radius: 14px;
  --radius-sm: 9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0D131E;
    --surface:#161F2E;
    --surface-2:#121A27;
    --ink:#F2F1EC;
    --ink-2:#BAC1D0;
    --ink-3:#828CA0;
    --border:rgba(242,241,236,0.14);
    --border-strong:rgba(242,241,236,0.26);
    --accent:#49C2AA;
    --accent-ink:#082019;
    --accent-soft:rgba(73,194,170,0.16);
    --good:#3fcf5f;
    --warning:#e0aa3a;
    --serious:#e8895f;
    --critical:#e8615f;
    --cat-1:#5b9bea; --cat-2:#e08252; --cat-3:#39bf8f; --cat-4:#d99f30; --cat-5:#e087ac;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.65);
    --focus-ring: 0 0 0 3px rgba(73,194,170,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0D131E;
  --surface:#161F2E;
  --surface-2:#121A27;
  --ink:#F2F1EC;
  --ink-2:#BAC1D0;
  --ink-3:#828CA0;
  --border:rgba(242,241,236,0.14);
  --border-strong:rgba(242,241,236,0.26);
  --accent:#49C2AA;
  --accent-ink:#082019;
  --accent-soft:rgba(73,194,170,0.16);
  --good:#3fcf5f;
  --warning:#e0aa3a;
  --serious:#e8895f;
  --critical:#e8615f;
  --cat-1:#5b9bea; --cat-2:#e08252; --cat-3:#39bf8f; --cat-4:#d99f30; --cat-5:#e087ac;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.65);
  --focus-ring: 0 0 0 3px rgba(73,194,170,.4);
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Source Sans 3', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces', Georgia, 'Times New Roman', serif;
  font-weight:600;
  line-height:1.15;
  margin:0 0 .5em;
  text-wrap:balance;
  color:var(--ink);
}
p{margin:0 0 1em;}
a{color:var(--accent);}
::selection{background:var(--accent-soft);}
:focus-visible{outline:none; box-shadow:var(--focus-ring); border-radius:6px;}
button{font-family:inherit;}
img,svg{display:block;max-width:100%;}
.tabular{font-variant-numeric:tabular-nums;}

.container{max-width:1080px;margin:0 auto;padding:0 24px;}
.container-narrow{max-width:760px;margin:0 auto;padding:0 24px;}

.boot{padding:80px 24px;text-align:center;color:var(--ink-3);font-size:15px;}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1080px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:20px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:0 0 auto;}
.brand-mark{
  width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand-mark svg{width:17px;height:17px;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-text b{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;}
.brand-text span{font-size:11px;color:var(--ink-3);letter-spacing:.03em;}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap;}
.nav a{
  text-decoration:none;color:var(--ink-2);font-size:14.5px;font-weight:600;
  padding:8px 12px;border-radius:8px;white-space:nowrap;
}
.nav a:hover{background:var(--surface-2);color:var(--ink);}
.nav a.active{background:var(--ink);color:var(--paper);}
.nav a.subtle{color:var(--ink-3);font-weight:600;font-size:13px;}

/* ---------- buttons ---------- */
.btn{
  appearance:none;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--ink);font-weight:600;font-size:14.5px;padding:11px 18px;border-radius:10px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;line-height:1.2;transition:transform .06s ease, background .15s ease;
}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn-danger{color:var(--critical);border-color:color-mix(in srgb, var(--critical) 45%, var(--border-strong));}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:8px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn svg{width:15px;height:15px;flex:0 0 auto;}

/* ---------- cards / layout ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);
}
.card + .card{margin-top:16px;}
.section-title{
  font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0 0 4px;
}
.section-hint{color:var(--ink-3);font-size:13.5px;margin:0 0 16px;}
.hr{border:none;border-top:1px solid var(--border);margin:20px 0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){.grid-2{grid-template-columns:1fr;}}

/* ---------- forms ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink);}
.field .req{color:var(--critical);}
.field-hint{font-size:12.5px;color:var(--ink-3);margin-top:5px;}
input[type=text],input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;
  padding:11px 12px;line-height:1.4;
}
textarea{resize:vertical;min-height:92px;}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:none;box-shadow:var(--focus-ring);border-color:var(--accent);
}
.choice-row{display:flex;gap:10px;flex-wrap:wrap;}
.choice-card{
  flex:1 1 160px;border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;
  cursor:pointer;background:var(--surface-2);display:flex;align-items:flex-start;gap:10px;
}
.choice-card input{width:auto;margin:3px 0 0;}
.choice-card.active{border-color:var(--accent);background:var(--accent-soft);}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);}
.checkline input{width:auto;margin-top:3px;}

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  padding:4px 10px;border-radius:100px;white-space:nowrap;letter-spacing:.01em;
}
.badge .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.badge-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border-strong);}
.badge-good{background:color-mix(in srgb, var(--good) 14%, var(--surface));color:color-mix(in srgb, var(--good) 70%, var(--ink));border:1px solid color-mix(in srgb, var(--good) 35%, transparent);}
.badge-good .dot{background:var(--good);}
.badge-warning{background:color-mix(in srgb, var(--warning) 16%, var(--surface));color:color-mix(in srgb, var(--warning) 65%, var(--ink));border:1px solid color-mix(in srgb, var(--warning) 40%, transparent);}
.badge-warning .dot{background:var(--warning);}
.badge-serious{background:color-mix(in srgb, var(--serious) 16%, var(--surface));color:color-mix(in srgb, var(--serious) 60%, var(--ink));border:1px solid color-mix(in srgb, var(--serious) 40%, transparent);}
.badge-serious .dot{background:var(--serious);}
.badge-critical{background:color-mix(in srgb, var(--critical) 16%, var(--surface));color:color-mix(in srgb, var(--critical) 60%, var(--ink));border:1px solid color-mix(in srgb, var(--critical) 40%, transparent);}
.badge-critical .dot{background:var(--critical);}
.badge-cat{border:1px solid var(--border-strong);}
.badge-status{background:var(--ink);color:var(--paper);}
.badge-status.st-recebido{background:var(--ink-3);}
.badge-status.st-triagem{background:color-mix(in srgb, var(--accent) 60%, var(--ink-3));}
.badge-status.st-investigacao{background:var(--accent);color:var(--accent-ink);}
.badge-status.st-concluido{background:var(--ink);}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;margin:8px 0 4px;}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative;}
.step .node{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-3);z-index:1;}
.step .label{font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:center;}
.step .line{position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border-strong);z-index:0;}
.step:first-child .line{display:none;}
.step.done .node{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.step.done .line{background:var(--ink);}
.step.done .label{color:var(--ink);}
.step.current .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.step.current .label{color:var(--ink);}

/* ---------- table / list ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px;}
thead th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);
  padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);
}
tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.row-link{cursor:pointer;}
tbody tr.row-link:hover{background:var(--surface-2);}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-weight:600;}

/* ---------- stat tiles ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media (max-width:860px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.stat-tile .stat-label{font-size:12.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
.stat-tile .stat-value{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
.stat-tile .stat-sub{font-size:12.5px;color:var(--ink-3);margin-top:8px;}

/* ---------- bars ---------- */
.bar-row{display:grid;grid-template-columns:minmax(150px,max-content) 1fr 40px;align-items:center;gap:12px;padding:7px 0;}
.bar-row .bar-name{font-size:13.5px;color:var(--ink-2);min-width:0;}
.bar-row .bar-name .badge{white-space:normal;}
.bar-track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;}
.bar-row .bar-count{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
@media (max-width:640px){.bar-row{grid-template-columns:1fr;row-gap:6px;}.bar-row .bar-count{text-align:left;}}

/* ---------- misc ---------- */
.banner{border-radius:12px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;}
.banner svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;}
.banner-info{background:var(--accent-soft);color:color-mix(in srgb, var(--accent) 55%, var(--ink));}
.banner-warn{background:color-mix(in srgb, var(--warning) 16%, var(--surface));color:color-mix(in srgb, var(--warning) 55%, var(--ink));border:1px solid color-mix(in srgb, var(--warning) 40%, transparent);}
.banner-good{background:color-mix(in srgb, var(--good) 14%, var(--surface));color:color-mix(in srgb, var(--good) 55%, var(--ink));}
.proto-code{
  font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:.02em;
}
.access-code{font-variant-numeric:tabular-nums;letter-spacing:.12em;font-weight:700;}
.msg{border-left:3px solid var(--border-strong);padding:8px 0 8px 14px;margin-bottom:10px;}
.msg.equipe{border-color:var(--accent);}
.msg.denunciante{border-color:var(--ink-3);}
.msg .msg-meta{font-size:11.5px;color:var(--ink-3);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.msg .msg-text{font-size:14.5px;color:var(--ink);white-space:pre-wrap;}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.overlay{
  position:fixed;inset:0;background:color-mix(in srgb, var(--paper) 80%, transparent);
  display:flex;align-items:center;justify-content:center;z-index:200;font-weight:600;color:var(--ink-2);
  backdrop-filter:blur(2px);
}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border-strong);border-top-color:var(--accent);
  animation:spin .7s linear infinite;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.footer{padding:40px 24px 60px;text-align:center;color:var(--ink-3);font-size:13px;}
.footer a{color:var(--ink-3);}
.kicker{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:10px;}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.filter-row select{width:auto;min-width:160px;}
.empty{color:var(--ink-3);font-size:14px;padding:24px 0;text-align:center;}
.readonly-note{font-size:12.5px;color:var(--ink-3);margin-top:6px;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);}
.legend-item .sw{width:10px;height:10px;border-radius:3px;}
@media (prefers-reduced-motion:reduce){.spinner{animation:none;}.toast{transition:none;}}
</style>
</head>

/* ---------- badges ---------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  padding:4px 10px;border-radius:100px;white-space:nowrap;letter-spacing:.01em;
}
.badge .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.badge-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border-strong);}
.badge-good{background:color-mix(in srgb, var(--good) 14%, var(--surface));color:color-mix(in srgb, var(--good) 70%, var(--ink));border:1px solid color-mix(in srgb, var(--good) 35%, transparent);}
.badge-good .dot{background:var(--good);}
.badge-warning{background:color-mix(in srgb, var(--warning) 16%, var(--surface));color:color-mix(in srgb, var(--warning) 65%, var(--ink));border:1px solid color-mix(in srgb, var(--warning) 40%, transparent);}
.badge-warning .dot{background:var(--warning);}
.badge-serious{background:color-mix(in srgb, var(--serious) 16%, var(--surface));color:color-mix(in srgb, var(--serious) 60%, var(--ink));border:1px solid color-mix(in srgb, var(--serious) 40%, transparent);}
.badge-serious .dot{background:var(--serious);}
.badge-critical{background:color-mix(in srgb, var(--critical) 16%, var(--surface));color:color-mix(in srgb, var(--critical) 60%, var(--ink));border:1px solid color-mix(in srgb, var(--critical) 40%, transparent);}
.badge-critical .dot{background:var(--critical);}
.badge-cat{border:1px solid var(--border-strong);}
.badge-status{background:var(--ink);color:var(--paper);}
.badge-status.st-recebido{background:var(--ink-3);}
.badge-status.st-triagem{background:color-mix(in srgb, var(--accent) 60%, var(--ink-3));}
.badge-status.st-investigacao{background:var(--accent);color:var(--accent-ink);}
.badge-status.st-concluido{background:var(--ink);}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:center;margin:8px 0 4px;}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;position:relative;}
.step .node{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-3);z-index:1;}
.step .label{font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:center;}
.step .line{position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border-strong);z-index:0;}
.step:first-child .line{display:none;}
.step.done .node{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.step.done .line{background:var(--ink);}
.step.done .label{color:var(--ink);}
.step.current .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.step.current .label{color:var(--ink);}

/* ---- build the full replacement document (canonical-source pattern) ----
   HEAD_HTML is a static JS constant (not a live DOM read) so a republish
   can never bake in anything the hosting shell may have injected into
   <head> at view time. The <script id="app-logic"> element is never
   mutated by any of our own code, so reading its own textContent back
   returns the exact static source it was parsed with. */
function buildDocument(state){
  var headHtml = HEAD_HTML;
  var appLogicSrc = document.getElementById('app-logic').textContent;
  var json = JSON.stringify(state).replace(/</g, '\\u003C');
  var html = '<!doctype html>\n<html lang="pt-BR">' + headHtml +
    '<body>\n<div id="app"><div class="boot">Carregando canal…</div></div>\n' +
    '<script type="application/json" id="state-data">\n' + json + '\n<' + '/script>\n' +
    '<script id="app-logic">' + appLogicSrc + '<' + '/script>\n' +
    '</body></html>';
  return html;
}

var pendingStash = null;
function stashNav(extra){
  var s = Object.assign({hash:location.hash, scroll:window.scrollY}, extra||{});
  try{ sessionStorage.setItem('ep_resume', JSON.stringify(s)); }catch(e){}
}

function commit(mutatorFn, opts){
  opts = opts || {};
  mutatorFn(STATE);
  if (localOnly || readOnlyMode || !artifactApi){
    render();
    if (readOnlyMode) toast('Visualização somente leitura nesta demonstração — alteração não foi salva.');
    return;
  }
  stashNav(opts.stash);
  showOverlay(true);
  artifactApi.publish(buildDocument(STATE)).then(function(){
    /* view reloads automatically on success */
  }).catch(function(err){
    showOverlay(false);
    var code = err && err.code;
    if (code === 'not_writer' || code === 'not_granted'){
      readOnlyMode = true;
      toast('Este link está em modo de visualização — mudanças não serão salvas para outras pessoas.');
      render();
    } else if (code === 'conflict'){
      /* runtime reloads this view to the winning version */
    } else {
      toast('Não foi possível salvar agora. A alteração ficou só nesta tela.');
      render();
    }
  });
}

function showOverlay(on){
  var ov = document.getElementById('ep-overlay');
  if(on){
    if(!ov){
      ov = document.createElement('div');
      ov.id='ep-overlay'; ov.className='overlay';
      ov.innerHTML = '<span class="spinner"></span> Salvando alterações…';
      document.body.appendChild(ov);
    }
  } else if(ov){ ov.remove(); }
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('ep-toast');
  if(!t){ t=document.createElement('div'); t.id='ep-toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}

async function submitForm(){
  const form = document.getElementById('ep-form');

  if (!form) {
    console.error('Formulário ep-form não encontrado.');
    return;
  }

  const submitButton = form.querySelector('button[type="submit"]');

  if (submitButton) {
    submitButton.disabled = true;
    submitButton.dataset.originalText = submitButton.textContent;
    submitButton.textContent = 'Enviando...';
  }

  try {
    const formData = new FormData(form);

    const anonima = formData.get('anonima') === 'on';

    const dados = {
      anonima: anonima,

      nome: anonima ? null : (formData.get('nome') || '').trim(),
      email: anonima ? null : (formData.get('email') || '').trim(),
      telefone: anonima ? null : (formData.get('telefone') || '').trim(),

      relacao_empresa: formData.get('relacao_empresa') || null,

      categoria: formData.get('categoria') || null,

      data_ocorrencia:
        formData.get('data_ocorrencia') || null,

      local_ocorrencia:
        (formData.get('local_ocorrencia') || '').trim(),

      envolvidos:
        (formData.get('envolvidos') || '').trim(),

      testemunhas:
        (formData.get('testemunhas') || '').trim(),

      descricao:
        (formData.get('descricao') || '').trim()
    };

    // Validações básicas
    if (!dados.categoria) {
      throw new Error('Selecione uma categoria.');
    }

    if (!dados.descricao) {
      throw new Error('Descreva o ocorrido.');
    }

    if (dados.descricao.length < 20) {
      throw new Error(
        'A descrição precisa ter pelo menos 20 caracteres.'
      );
    }

    const endpoint =
      'https://zttqgkxnczzvfuxzratf.supabase.co/functions/v1/bright-service';

    const response = await fetch(endpoint, {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify(dados)
    });

    const resultado = await response.json();

    console.log('Resposta da Edge Function:', resultado);

    if (!response.ok) {
      throw new Error(
        resultado?.erro ||
        resultado?.mensagem ||
        'Não foi possível registrar a denúncia.'
      );
    }

    if (!resultado.sucesso) {
      throw new Error(
        resultado?.mensagem ||
        'Não foi possível registrar a denúncia.'
      );
    }

    /*
     * O protocolo e a senha são gerados
     * exclusivamente pela Edge Function.
     */

    const protocolo = resultado.protocolo;
    const senha = resultado.senha;

    // Guarda temporariamente os dados da denúncia
    window.ULTIMA_DENUNCIA = {
      protocolo: protocolo,
      senha: senha
    };

    console.log('Denúncia registrada:', protocolo);

    /*
     * Mostra a tela de sucesso existente.
     *
     * Primeiro tentamos as funções que já possam existir
     * no seu HTML.
     */

    if (typeof showSuccess === 'function') {

      showSuccess(protocolo, senha);

    } else if (typeof mostrarSucesso === 'function') {

      mostrarSucesso(protocolo, senha);

    } else {

      /*
       * Fallback temporário.
       * Depois vamos integrar isso à tela visual
       * existente do seu site.
       */

      alert(
        'Denúncia registrada com sucesso!\n\n' +
        'Protocolo: ' + protocolo + '\n' +
        'Senha: ' + senha
      );
    }

  } catch (error) {

    console.error(
      'Erro ao enviar denúncia:',
      error
    );

    alert(
      error?.message ||
      'Ocorreu um erro ao registrar a denúncia. Tente novamente.'
    );

  } finally {

    if (submitButton) {
      submitButton.disabled = false;

      submitButton.textContent =
        submitButton.dataset.originalText ||
        'Enviar manifestação';
    }
  }
}

async function lookupSubmit(form){
  var fd = new FormData(form);

  var protocolo = (fd.get('protocolo') || '').trim().toUpperCase();
  var accessCode = (fd.get('accessCode') || '').trim();

  lookupDraft = {
    protocolo: protocolo,
    accessCode: accessCode
  };

  lookupError = '';
  lookupResultId = null;

  if(!protocolo || !accessCode){
    lookupError = 'Informe o protocolo e o código de acesso.';
    render();
    return;
  }

  var submitButton = form.querySelector('button[type="submit"]');

  if(submitButton){
    submitButton.disabled = true;
    submitButton.dataset.originalText = submitButton.textContent;
    submitButton.textContent = 'Consultando…';
  }

  try{

    var endpoint =
      'https://zttqgkxnczzvfuxzratf.supabase.co/functions/v1/swift-processor';

    var response = await fetch(endpoint, {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json',
        'apikey': 'sb_publishable_NDH3uBdH8wxGGReCxn_Slg_OvxuTZjf'
      },

      body: JSON.stringify({
        protocolo: protocolo,
        senha: accessCode
      })
    });

    var resultado = await response.json();

    console.log('Resposta da consulta:', resultado);

    if(!response.ok){
      throw new Error(
        resultado?.erro ||
        resultado?.mensagem ||
        'Não foi possível consultar a denúncia.'
      );
    }

    if(!resultado.sucesso || !resultado.denuncia){
      throw new Error(
        resultado?.erro ||
        'Protocolo ou código de acesso inválido.'
      );
    }

    var denuncia = resultado.denuncia;

    /*
     * Converte a resposta do Supabase
     * para o formato utilizado pela tela atual.
     */

    var caso = {
      id: denuncia.protocolo,

      protocolo: denuncia.protocolo,

      accessCode: accessCode,

      createdAt:
        denuncia.criado_em || new Date().toISOString(),

      anonymous:
        denuncia.anonima === true,

      denunciante:
        denuncia.anonima
          ? null
          : {
              nome: denuncia.nome || '',
              email: denuncia.email || '',
              telefone: denuncia.telefone || '',
              area: denuncia.relacao_empresa || ''
            },

      categoria:
        denuncia.categoria || '',

      dataFato:
        denuncia.data_ocorrencia || '',

      local:
        denuncia.local_ocorrencia || '',

      pessoasEnvolvidas:
        denuncia.envolvidos || '',

      descricao:
        denuncia.descricao || '',

      testemunhas:
        denuncia.testemunhas || '',

      status:
        denuncia.status || 'recebida',

      prioridade:
        denuncia.prioridade || 'media',

      mensagens:
        Array.isArray(denuncia.mensagens)
          ? denuncia.mensagens
          : [],

      log: []
    };

    /*
     * Guarda o resultado da consulta.
     */

    window.ULTIMA_CONSULTA_DENUNCIA = caso;

    /*
     * A tela atual utiliza STATE.cases para
     * localizar a denúncia.
     *
     * Aqui colocamos apenas o resultado consultado
     * em memória. Nada é gravado novamente no banco.
     */

    STATE.cases = [caso];

    lookupError = '';
    lookupResultId = caso.id;

    render();

  } catch(error){

    console.error(
      'Erro ao consultar denúncia:',
      error
    );

    lookupResultId = null;

    lookupError =
      error?.message ||
      'Não foi possível consultar a denúncia. Tente novamente.';

    render();

  } finally {

    if(submitButton){

      submitButton.disabled = false;

      submitButton.textContent =
        submitButton.dataset.originalText ||
        'Consultar';

    }

  }
}

async function carregarCasosAdmin(){

  try{

    var resultado =
      await supabaseClient
        .from('denuncias')
        .select(
          'id,protocolo,anonima,nome,email,telefone,relacao_empresa,categoria,data_ocorrencia,local_ocorrencia,envolvidos,testemunhas,descricao,status,prioridade,criado_em,atualizado_em,responsavel_id'
        )
        .order('criado_em', {
          ascending: false
        });

    if(resultado.error){
      throw resultado.error;
    }

    var denuncias =
      resultado.data || [];

    STATE.cases =
      denuncias.map(mapearDenunciaParaCaso);

    console.log(
      'Denúncias carregadas do Supabase:',
      STATE.cases
    );

  } catch(error){

    console.error(
      'Erro ao carregar denúncias:',
      error
    );

    STATE.cases = [];

    toast(
      'Não foi possível carregar as denúncias.'
    );

  }

}

async function carregarSessaoAdmin(){

  if(adminAuthLoading) return;

  adminAuthLoading = true;

  try{

    var resultado =
      await supabaseClient.auth.getSession();

    if(resultado.error){
      throw resultado.error;
    }

    adminSession =
      resultado.data.session || null;

    adminProfile = null;

    if(adminSession){

      var perfil =
        await supabaseClient
          .from('perfis_admin')
          .select('id,nome,cargo,ativo')
          .eq('id', adminSession.user.id)
          .eq('ativo', true)
          .maybeSingle();

      if(perfil.error){
        throw perfil.error;
      }

      if(!perfil.data){

        await supabaseClient.auth.signOut();

        adminSession = null;
        adminProfile = null;

      } else {

        adminProfile = perfil.data;

        /*
         * Usuário autenticado e autorizado.
         * Agora carregamos as denúncias reais.
         */

        await carregarCasosAdmin();

      }

    }

  } catch(error){

    console.error(
      'Erro ao carregar sessão administrativa:',
      error
    );

    adminSession = null;
    adminProfile = null;

  } finally {

    adminAuthReady = true;
    adminAuthLoading = false;

    render();

  }
}

async function adminGateSubmit(form){

  var fd = new FormData(form);

  var email =
    (fd.get('email') || '').trim();

  var password =
    fd.get('password') || '';

  var button =
    form.querySelector('button[type="submit"]');

  if(!email || !password){
    toast('Informe seu e-mail e sua senha.');
    return;
  }

  if(button){
    button.disabled = true;
    button.dataset.originalText =
      button.textContent;
    button.textContent = 'Entrando...';
  }

  try{

    var resultado =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(resultado.error){
      throw resultado.error;
    }

    adminSession =
      resultado.data.session;

    /*
     * Depois do login, verificamos se o usuário
     * também está cadastrado como administrador
     * em public.perfis_admin.
     */

    var perfil =
      await supabaseClient
        .from('perfis_admin')
        .select('id,nome,cargo,ativo')
        .eq('id', adminSession.user.id)
        .eq('ativo', true)
        .maybeSingle();

    if(perfil.error){
      throw perfil.error;
    }

    if(!perfil.data){

      await supabaseClient.auth.signOut();

      adminSession = null;
      adminProfile = null;

      throw new Error(
        'Seu usuário não está autorizado para acessar a área administrativa.'
      );
    }

    adminProfile =
      perfil.data;

    adminAuthReady = true;

    toast(
      'Acesso autorizado.'
    );

    render();

  } catch(error){

    console.error(
      'Erro no login administrativo:',
      error
    );

    adminSession = null;
    adminProfile = null;

    var errorBox =
      document.getElementById(
        'admin-login-error'
      );

    if(errorBox){

      errorBox.innerHTML =
        '<div class="banner banner-warn" style="margin-bottom:14px;">' +
          iconWarn() +
          '<div>' +
            esc(
              error?.message ||
              'E-mail ou senha inválidos.'
            ) +
          '</div>' +
        '</div>';

    } else {

      toast(
        error?.message ||
        'Não foi possível entrar.'
      );

    }

  } finally {

    if(button){

      button.disabled = false;

      button.textContent =
        button.dataset.originalText ||
        'Entrar';

    }

  }
}

function computeIndicators(){
  var cases = STATE.cases;
  var total = cases.length;
  var anon = cases.filter(function(c){ return c.anonymous; }).length;
  var byGroup = {};
  CATEGORY_GROUPS.forEach(function(g){ byGroup[g.id]=0; });
  cases.forEach(function(c){ var f=CAT_INDEX[c.categoria]; if(f) byGroup[f.group.id]++; });
  var byRisk = {baixo:0,medio:0,alto:0,critico:0,null:0};
  cases.forEach(function(c){ byRisk[c.risco || 'null']++; });
  var concluded = cases.filter(function(c){ return c.status==='concluido'; });
  var byConclusao = {procedente:0,parcial:0,nao_procedente:0,inconclusiva:0};
  concluded.forEach(function(c){ if(c.conclusao) byConclusao[c.conclusao]++; });
  var triagemDurations = cases.filter(function(c){ return c.milestones.triagemEm; }).map(function(c){ return daysBetween(c.milestones.recebidoEm, c.milestones.triagemEm); });
  var invDurations = cases.filter(function(c){ return c.milestones.investigacaoEm && c.milestones.concluidoEm; }).map(function(c){ return daysBetween(c.milestones.investigacaoEm, c.milestones.concluidoEm); });
  function avg(arr){ if(!arr.length) return null; return Math.round((arr.reduce(function(a,b){return a+b;},0)/arr.length)*10)/10; }
  var criticosAbertos = cases.filter(function(c){ return c.risco==='critico' && c.status!=='concluido'; }).length;
  var medidas = cases.filter(function(c){ return (c.medidasAdotadas||'').trim().length>0; }).length;
  return {
    total:total, anonPct: total? Math.round(anon/total*100):0, byGroup:byGroup, byRisk:byRisk,
    concluded:concluded.length, byConclusao:byConclusao,
    avgTriagem: avg(triagemDurations), avgInvestigacao: avg(invDurations),
    criticosAbertos: criticosAbertos, medidas: medidas
  };
}

          '<textarea name="nota" placeholder="Adicionar nota interna (visível só para a equipe)…">' +
            esc(internalNoteDraft || '') +
          '</textarea>' +
        '</div>' +

        '<button class="btn btn-sm" type="submit">' +
          'Adicionar nota' +
        '</button>' +

      '</form>' +

    '</div>' +


    '<div class="card">' +

      '<div class="section-title" style="font-size:16px;">Conclusão e encerramento</div>' +

      '<form data-action="save-conclusao" data-id="' + c.id + '">' +

        '<div class="field">' +
          '<label>Resultado da investigação</label>' +

          '<select name="conclusao">' +

            '<option value="">Em aberto</option>' +

            Object.keys(CONCLUSAO_INFO)
              .map(function(k){

                return '<option value="' + k + '"' +
                  (c.conclusao === k ? ' selected' : '') +
                  '>' +
                  CONCLUSAO_INFO[k].label +
                  '</option>';

              })
              .join('') +

          '</select>' +

        '</div>' +

        '<div class="field">' +
          '<label>Fundamentação</label>' +
          '<textarea name="fundamentacao">' +
            esc(c.fundamentacao || '') +
          '</textarea>' +
        '</div>' +

        '<div class="field">' +
          '<label>Medidas adotadas</label>' +
          '<textarea name="medidasAdotadas">' +
            esc(c.medidasAdotadas || '') +
          '</textarea>' +
        '</div>' +

        '<button class="btn btn-primary btn-sm" type="submit">' +
          'Salvar conclusão' +
        '</button>' +

      '</form>' +

      (
        c.status !== 'concluido'

        ?

        '<div style="margin-top:14px;">' +

          '<form data-action="encerrar-caso" data-id="' + c.id + '">' +

            '<button class="btn btn-danger btn-sm" type="submit" ' +
              (!c.conclusao ? 'disabled' : '') +
            '>' +
              'Encerrar caso' +
            '</button>' +

            (
              !c.conclusao
                ?
                  '<div class="readonly-note">' +
                    'Defina um resultado da investigação antes de encerrar.' +
                  '</div>'
                :
                  ''
            ) +

          '</form>' +

        '</div>'

        :

        '<div class="banner banner-good" style="margin-top:14px;">' +
          iconShield() +
          '<div>Caso encerrado em ' +
            fmtDate(c.milestones && c.milestones.concluidoEm) +
          '.</div>' +
        '</div>'
      ) +

    '</div>' +


    '<div class="card">' +

      '<div class="section-title" style="font-size:16px;">Comunicação com o denunciante</div>' +

      '<div class="section-hint">' +
        'Mensagens abaixo (exceto notas internas) ficam visíveis para quem consultar o protocolo.' +
      '</div>' +

      (
        c.log
          ? c.log
              .filter(function(l){
                return l.tipo !== 'interno';
              })
              .map(function(l){

                var cls =
                  l.tipo === 'mensagem_equipe'
                    ? 'equipe'
                    : (
                        l.tipo === 'mensagem_denunciante'
                          ? 'denunciante'
                          : ''
                      );

                var who =
                  l.tipo === 'mensagem_equipe'
                    ? 'Equipe do canal'
                    : (
                        l.tipo === 'mensagem_denunciante'
                          ? 'Denunciante'
                          : 'Sistema'
                      );

                return '<div class="msg ' + cls + '">' +

                  '<div class="msg-meta">' +
                    who +
                    ' · ' +
                    fmtDateTime(l.ts) +
                  '</div>' +

                  '<div class="msg-text">' +
                    nl2br(l.texto) +
                  '</div>' +

                '</div>';

              })
              .join('')

          : ''
      ) +

      '<form data-action="send-message" data-id="' + c.id + '" style="margin-top:10px;">' +

        '<div class="field">' +
          '<textarea name="mensagem" placeholder="Escreva uma mensagem visível ao denunciante…">' +
            esc(equipeMsgDraft || '') +
          '</textarea>' +
        '</div>' +

        '<button class="btn btn-sm" type="submit">' +
          'Enviar mensagem ao denunciante' +
        '</button>' +

      '</form>' +

    '</div>' +

  '</div>' +

  footerHTML();
}

/* ====================== admin actions ====================== */
function saveTriagem(form, id){
  var fd = new FormData(form);
  commit(function(state){
    var c = caseById(id); if(!c) return;
    var newStatus = fd.get('status');
    var urgente = !!fd.get('urgente');
    if(newStatus !== c.status){
      if(newStatus==='triagem' && !c.milestones.triagemEm) c.milestones.triagemEm = nowISO();
      if(newStatus==='investigacao' && !c.milestones.investigacaoEm) c.milestones.investigacaoEm = nowISO();
      c.status = newStatus;
      c.log.push({ts:nowISO(), tipo:'sistema', autor:'Sistema', texto:'Status atualizado para "'+STATUS_INFO[newStatus].label+'".'});
    }
    c.urgente = urgente;
    c.responsavel = fd.get('responsavel') || '';
  }, { stash:{hash:'#admin/caso/'+id} });
}
function saveConflito(form, id){
  var fd = new FormData(form);
  commit(function(state){
    var c = caseById(id); if(!c) return;
    c.conflitoInteresse = {verificado: !!fd.get('verificado'), detalhe: fd.get('detalhe')||''};
  }, { stash:{hash:'#admin/caso/'+id} });
}
function saveRisco(form, id){
  var fd = new FormData(form);
  var risco = fd.get('risco');
  if(!risco){ toast('Selecione um nível de risco.'); return; }
  commit(function(state){
    var c = caseById(id); if(!c) return;
    c.risco = risco;
    c.log.push({ts:nowISO(), tipo:'interno', autor:'Sistema', texto:'Classificação de risco definida como "'+RISK_INFO[risco].label+'".'});
  }, { stash:{hash:'#admin/caso/'+id} });
}
function saveInvestigacao(form, id){
  var fd = new FormData(form);
  commit(function(state){
    var c = caseById(id); if(!c) return;
    c.evidenciasAnalisadas = fd.get('evidenciasAnalisadas')||'';
    c.diligencias = fd.get('diligencias')||'';
  }, { stash:{hash:'#admin/caso/'+id} });
}
function addNote(form, id){
  var fd = new FormData(form);
  var nota = (fd.get('nota')||'').trim();
  if(!nota) return;
  internalNoteDraft = '';
  commit(function(state){
    var c = caseById(id); if(!c) return;
    c.log.push({ts:nowISO(), tipo:'interno', autor:'Equipe', texto:nota});
  }, { stash:{hash:'#admin/caso/'+id} });
}
function saveConclusao(form, id){
  var fd = new FormData(form);
  commit(function(state){
    var c = caseById(id); if(!c) return;
    c.conclusao = fd.get('conclusao') || null;
    c.fundamentacao = fd.get('fundamentacao')||'';
    c.medidasAdotadas = fd.get('medidasAdotadas')||'';
  }, { stash:{hash:'#admin/caso/'+id} });
}
function encerrarCaso(id){
  commit(function(state){
    var c = caseById(id); if(!c || !c.conclusao) return;
    c.status = 'concluido';
    c.milestones.concluidoEm = nowISO();
    c.log.push({ts:nowISO(), tipo:'sistema', autor:'Sistema', texto:'Caso encerrado. Resultado: '+CONCLUSAO_INFO[c.conclusao].label+'.'});
  }, { stash:{hash:'#admin/caso/'+id} });
}
function sendMessage(form, id){
  var fd = new FormData(form);
  var texto = (fd.get('mensagem')||'').trim();
  if(!texto) return;
  equipeMsgDraft = '';
  commit(function(state){
    var c = caseById(id); if(!c) return;
    c.log.push({ts:nowISO(), tipo:'mensagem_equipe', autor:'Equipe', texto:texto});
  }, { stash:{hash:'#admin/caso/'+id} });
}

/* ====================== render dispatcher ====================== */
function render(){
  var parts = route();
  var html;
  if(parts[0]==='novo') html = viewNovo();
  else if(parts[0]==='protocolo') html = viewProtocolo();
  else if(parts[0]==='admin') html = viewAdmin(parts);
  else html = viewHome();
  document.getElementById('app').innerHTML = html;
  window.scrollTo({top:0});
  justSubmitted = false;
}

/* ====================== event delegation ====================== */
document.addEventListener('submit', function(e){
  var form = e.target;
  if(form.id==='ep-form'){ e.preventDefault(); submitForm(form); }
  else if(form.id==='ep-lookup'){ e.preventDefault(); lookupSubmit(form); }
  else if(form.id==='ep-reply'){ e.preventDefault(); replySubmit(form, lookupResultId); }
  else if(form.id==='ep-admin-gate'){ e.preventDefault(); adminGateSubmit(form); }
  else if(form.dataset && form.dataset.action){
    e.preventDefault();
    var id = form.dataset.id;
    var action = form.dataset.action;
    if(action==='save-triagem') saveTriagem(form,id);
    else if(action==='save-conflito') saveConflito(form,id);
    else if(action==='save-risco') saveRisco(form,id);
    else if(action==='save-investigacao') saveInvestigacao(form,id);
    else if(action==='add-note') addNote(form,id);
    else if(action==='save-conclusao') saveConclusao(form,id);
    else if(action==='encerrar-caso') encerrarCaso(id);
    else if(action==='send-message') sendMessage(form,id);
  }
});

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.dataset.action;
  if(action==='open-case'){ location.hash = '#admin/caso/'+t.dataset.id; }
  else if(action==='admin-logout'){
  (async function(){

    try{

      await supabaseClient.auth.signOut();

    }catch(error){

      console.error(
        'Erro ao sair:',
        error
      );

    }

    adminSession = null;
    adminProfile = null;
    adminAuthReady = true;

    location.hash = '#home';
    render();

  })();
}
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.matches('[data-filter]')){
    adminFilters[t.dataset.filter] = t.value;
    render();
  } else if(t.name==='anon' && t.closest('#ep-form')){
    formDraft.anonymous = t.value==='1';
    render();
  }
});

/* ====================== boot ====================== */
async function boot(){

  var resumed = false;

  try{

    var raw =
      sessionStorage.getItem('ep_resume');

    if(raw){

      var r =
        JSON.parse(raw);

      sessionStorage.removeItem('ep_resume');

      if(r.hash)
        location.hash = r.hash;

      if(r.lookup)
        lookupDraft = r.lookup;

      if(r.resultId)
        lookupResultId = r.resultId;

      if(r.justSubmitted)
        justSubmitted = true;

      resumed = true;

    }

  }catch(e){}

  /*
   * Verifica a sessão real do Supabase.
   */

  await carregarSessaoAdmin();

  if(!resumed){

    render();

  }else{

    render();

  }
}
boot();

})();
</script>
